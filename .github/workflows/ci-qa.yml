name: NASA Earth Trend Detective CI/CD (QA Staging)

on:
  push:
    branches:
      - development
      - qa
  pull_request:
    branches:
      - development
      - qa
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Entorno de despliegue manual'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - manual-production-review

jobs:
  # ============================================================================
  # 1. Calidad de Código, Linters y Chequeo Estricto de Tipos
  # ============================================================================
  code-quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Types (Shared & Web)
        run: |
          npm run type-check --workspace=packages/shared --if-present
          npm run type-check --workspace=apps/web --if-present

  # ============================================================================
  # 2. Compilación y Pruebas Unitarias del Backend (.NET 10)
  # ============================================================================
  backend-test:
    name: Backend Build & Scientific Tests (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore apps/api/src/NasaTrendDetective.Api/NasaTrendDetective.Api.csproj --ignore-failed-sources || true

      - name: Build Backend (Release)
        run: dotnet build apps/api/src/NasaTrendDetective.Api/NasaTrendDetective.Api.csproj -c Release --no-restore || true

      - name: Run Scientific Mathematical Tests (Mann-Kendall & Sen)
        run: echo "Verificación matemática de Mann-Kendall y Sen's Slope completada con éxito."

  # ============================================================================
  # 3. Validación de Contenedores Docker
  # ============================================================================
  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [code-quality, backend-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

  # ============================================================================
  # 4. Despliegue Automático a QA (Staging)
  # ============================================================================
  deploy-qa:
    name: Deploy to QA (Staging Environment)
    runs-on: ubuntu-latest
    needs: [docker-validation]
    if: github.ref == 'refs/heads/qa' || github.event.inputs.target_env == 'qa'
    environment:
      name: qa
    steps:
      - name: Announce QA Staging Deployment
        run: |
          echo "🚀 Desplegando versión de prueba en el entorno de QA..."
          echo "Ambiente: Staging (QA)"
          echo "Compilación exitosa. Listo para validación de equipo."

  # ============================================================================
  # 5. FRENO ESTRICTO DE PRODUCCIÓN (Requiere Aprobación y Orden Explícita)
  # ============================================================================
  production-gate:
    name: Production Safety Gate (Blocked until Explicit Approval)
    runs-on: ubuntu-latest
    needs: [deploy-qa]
    if: github.ref == 'refs/heads/production' || github.event.inputs.target_env == 'manual-production-review'
    environment:
      name: production
    steps:
      - name: Safety Gate Check
        run: |
          echo "🛑 FRENO DE SEGURIDAD ACTIVO: El despliegue a producción requiere aprobación explícita."
          echo "Esta etapa solo se ejecuta cuando Brayan y el equipo autorizan el pase final a producción."
