name: GitHub Copilot PR Governance & Quota Guard

on:
  pull_request:
    types: [opened, ready_for_review, labeled]
    branches:
      - development
      - qa
      - production
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: copilot-governance-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  filter-and-evaluate:
    name: Gobernanza Copilot y Filtro Anti-Saturacion
    runs-on: ubuntu-latest

    # FILTRO 1: No ejecutar en borradores (Draft PRs)
    # FILTRO 2: No ejecutar en bots (Dependabot, etc.)
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/copilot-review'))

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar Estrategia de 3 Ramas (Regla 4 GEMINI.md)
        id: branch-check
        run: |
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Target: $TARGET_BRANCH | Source: $SOURCE_BRANCH"

          if [ "$TARGET_BRANCH" = "production" ] && [ "$SOURCE_BRANCH" != "qa" ]; then
            echo "::error::Violación de Regla 4: No se permite merge directo a production sin pasar por qa."
            echo "branch_violation=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_violation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspeccionar Cambios y Detectar Archivos Ignorados (Filtro 3)
        id: diff-check
        run: |
          BASE_BRANCH="${{ github.event.pull_request.base.ref || 'development' }}"
          CHANGED=$(git diff --name-only "origin/$BASE_BRANCH...HEAD" || git diff --name-only HEAD~1)
          
          # Verificar si solo cambiaron docs, texturas o lockfiles
          CODE_FILES=$(echo "$CHANGED" | grep -E '\.(ts|tsx|cs|py|sql|mjs|js|json)$' | grep -v 'package-lock.json' || true)
          
          if [ -z "$CODE_FILES" ]; then
            echo "Solo se modificaron assets estaticos, documentacion o lockfiles. Ahorrando cuota de tokens."
            echo "skip_llm=true" >> "$GITHUB_OUTPUT"
          else
            echo "Archivos de codigo detectados. Requiere revision estricta."
            echo "skip_llm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ejecutar Auditoria Estatica y Evaluacion de Reglas
        env:
          GEMINI_API_KEY: ${{ steps.diff-check.outputs.skip_llm == 'false' && secrets.GEMINI_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'development' }}
        run: |
          node .github/scripts/ai-pr-reviewer.mjs

      - name: Gestionar Etiquetas y Notificacion de Gobernanza
        if: steps.branch-check.outputs.branch_violation == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '⚠️ **Bloqueo de Gobernanza:** Este PR intenta fusionar directamente a `production` sin provenir de `qa`. Conforme al protocolo del proyecto (Regla 4 en GEMINI.md), debe apuntar primero a `development` o ser promovido exclusivamente desde `qa`.'
            });
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels: ['requiere-qa-previo', 'cambios-solicitados']
            });
