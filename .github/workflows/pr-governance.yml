name: PR Governance, Authorship & Review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled]
    branches:
      - development
      - qa
      - production
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Gobernanza rápida en cada PR: flujo de 3 ramas, autoría limpia y <=300L
  # ============================================================================
  authorship-and-rules:
    name: Authorship, Branch Flow & Line Limit
    if: >-
      github.repository_owner == 'nasa-earth-detectives'
      && github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce 3-Branch Promotion Strategy (qa -> production)
        id: branch-check
        run: |
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Target: $TARGET_BRANCH | Source: $SOURCE_BRANCH"

          if [ "$TARGET_BRANCH" = "production" ] && [ "$SOURCE_BRANCH" != "qa" ]; then
            echo "::error::No se permite merge directo a production sin provenir de qa."
            echo "branch_violation=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch_violation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Annotate & Fail on Direct-to-Production Violation
        if: steps.branch-check.outputs.branch_violation == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const isFork = Boolean(context.payload.pull_request?.head?.repo?.fork);
            if (!isFork) {
              const warning = '⚠️ **Bloqueo de Gobernanza:** Este PR intenta fusionar directamente a `production` sin provenir de `qa`. Debe apuntar primero a `development` o promoverse desde `qa`.';
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 50
              });
              if (!comments.some(c => c.body?.includes('Bloqueo de Gobernanza'))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: warning
                });
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels: ['requiere-qa-previo', 'cambios-solicitados']
              });
            }
            core.setFailed('El PR a production debe originarse desde qa.');

      - name: Verify Clean Human Authorship (Commits & PR Body)
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          FORBIDDEN_PATTERNS="Co-Authored-By:.*Claude|Co-Authored-By:.*Anthropic|Co-Authored-By:.*ChatGPT|Co-Authored-By:.*OpenAI|Co-Authored-By:.*Copilot|Generated with \[Claude Code\]|Generated by AI"
          FAILED=0

          git fetch origin "$BASE_REF" --quiet || true
          COMMIT_HASHES=$(git log "origin/${BASE_REF}..HEAD" --pretty=format:"%H" 2>/dev/null || true)

          for HASH in $COMMIT_HASHES; do
            [ -z "$HASH" ] && continue
            FULL_MSG=$(git log -1 --pretty=format:"%B" "$HASH")
            SUBJECT=$(git log -1 --pretty=format:"%s" "$HASH")
            if echo "$FULL_MSG" | grep -Eiq "$FORBIDDEN_PATTERNS"; then
              echo "::error file=git,title=Firma o Co-Autoría de IA Detectada::El commit $HASH ($SUBJECT) contiene menciones o co-autoría explícita de IA."
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          if echo "$PR_BODY" | grep -Eiq "Generated with \[Claude Code\]|Generated by ChatGPT|Generated by Copilot|Generated by AI"; then
            echo "::error title=Firma de IA en PR::La descripción del Pull Request contiene una marca de generación por IA."
            exit 1
          fi

          echo "✅ Commits y descripción del PR verificados sin firmas de IA."

      - name: Enforce File Size Limit (<= 300 lines)
        run: |
          oversized=$(find frontend/src packages/shared/src backend/src \
            \( -name '*.ts' -o -name '*.tsx' -o -name '*.cs' \) \
            -not -path '*/bin/*' -not -path '*/obj/*' \
            -exec awk 'END { if (NR > 300) print FILENAME " (" NR " líneas)" }' {} \;)
          if [ -n "$oversized" ]; then
            echo "::error::Archivos que superan el límite de 300 líneas:"
            echo "$oversized"
            exit 1
          fi
          echo "✅ Modularidad verificada: todos los archivos fuente <= 300 líneas."

  # ============================================================================
  # 2. Auditoría estática/IA única por demanda (sin duplicar comentarios)
  # ============================================================================
  pr-audit:
    name: PR Static & AI Audit
    if: >-
      github.repository_owner == 'nasa-earth-detectives'
      && (
        (github.event_name == 'pull_request'
          && !github.event.pull_request.draft
          && !github.event.pull_request.head.repo.fork
          && github.actor != 'dependabot[bot]'
          && (github.event.action == 'opened'
            || github.event.action == 'ready_for_review'
            || (github.event.action == 'labeled' && github.event.label.name == 'copilot-review')))
        || (github.event_name == 'issue_comment'
          && github.event.issue.pull_request
          && contains(github.event.comment.body, '/copilot-review')
          && github.actor != 'github-actions[bot]')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Resolve Pull Request Metadata
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            const isSameRepo = pr.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const isPromotion =
              (pr.head.ref === 'development' && pr.base.ref === 'qa') ||
              (pr.head.ref === 'qa' && pr.base.ref === 'production');
            core.setOutput('number', String(prNumber));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('safe_repo', isSameRepo ? 'true' : 'false');
            core.setOutput('is_promotion', isPromotion ? 'true' : 'false');

      - name: Checkout Pull Request Target
        if: steps.pr.outputs.safe_repo == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Evaluate Code Changes for Token Guard
        if: steps.pr.outputs.safe_repo == 'true'
        id: diff-check
        run: |
          BASE_BRANCH="${{ steps.pr.outputs.base_ref }}"
          git fetch origin "$BASE_BRANCH" --quiet || true
          CHANGED=$(git diff --name-only "origin/${BASE_BRANCH}...HEAD" 2>/dev/null || true)
          CODE_FILES=$(echo "$CHANGED" | grep -E '\.(ts|tsx|cs|py|sql|mjs|js)$' || true)

          if [ -z "$CODE_FILES" ] || [ "${{ steps.pr.outputs.is_promotion }}" = "true" ]; then
            echo "skip_llm=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_llm=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.pr.outputs.safe_repo == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run PR Auditor (Single Upsert Comment)
        if: steps.pr.outputs.safe_repo == 'true'
        env:
          GEMINI_API_KEY: ${{ steps.diff-check.outputs.skip_llm == 'false' && secrets.GEMINI_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: node .github/scripts/ai-pr-reviewer.mjs
