name: Verify Human Authorship & Clean Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [development, qa, main]

jobs:
  check-authorship:
    name: Enforce Clean Human Authorship
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Git Commits for AI Co-Authorship & Bot Trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "🔍 Analizando mensajes de commits y trailers de autoría..."
          
          # Patrones prohibidos en trailers y mensajes de commit
          FORBIDDEN_PATTERNS="Co-Authored-By:.*Claude|Co-Authored-By:.*Anthropic|Co-Authored-By:.*ChatGPT|Co-Authored-By:.*OpenAI|Co-Authored-By:.*Copilot|Generated with \[Claude Code\]|Generated by AI"
          
          FAILED=0
          
          if [ "$EVENT_NAME" = "pull_request" ]; then
            COMMIT_HASHES=$(git log origin/"$BASE_REF"..HEAD --pretty=format:"%H")
          else
            COMMIT_HASHES=$(git log -n 10 --pretty=format:"%H")
          fi
          
          for HASH in $COMMIT_HASHES; do
            [ -z "$HASH" ] && continue
            
            FULL_MSG=$(git log -1 --pretty=format:"%B" "$HASH")
            SUBJECT=$(git log -1 --pretty=format:"%s" "$HASH")
            
            if echo "$FULL_MSG" | grep -Ei "$FORBIDDEN_PATTERNS" > /dev/null; then
              echo "::error file=git,title=Firma o Co-Autoría de IA Detectada::El commit $HASH ($SUBJECT) contiene menciones o co-autoría explícita de IA en su mensaje/trailers."
              echo "Detalle del commit: $HASH"
              echo "$FULL_MSG"
              FAILED=1
            fi
          done
          
          if [ "$FAILED" -eq 1 ]; then
            echo "❌ Falló la verificación: Limpia los mensajes de commit con 'git rebase -i' eliminando los trailers de IA."
            exit 1
          fi
          
          echo "✅ Todos los commits verificados: 100% autoría limpia del equipo humano."

      - name: Verify PR Description for AI Signatures
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "🔍 Analizando cuerpo y descripción del Pull Request..."
          if echo "$PR_BODY" | grep -Ei "Generated with \[Claude Code\]|Generated by ChatGPT|Generated by Copilot|Generated by AI" > /dev/null; then
            echo "::error title=Firma de IA en PR::La descripción del Pull Request contiene una firma o marca de generación por IA."
            echo "Por favor edita la descripción del PR y remueve la línea de pie de página."
            exit 1
          fi
          
          echo "✅ Descripción del Pull Request limpia de firmas de herramientas generativas."
