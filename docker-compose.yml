services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: nasa-trend-detective-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - DUCKDB_DATABASE_PATH=/app/data/nasa_earth_trends.duckdb
    volumes:
      - nasa_data:/app/data
    networks:
      - nasa-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nasa-trend-detective-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://api:5000
    networks:
      - nasa-net

networks:
  nasa-net:
    driver: bridge

volumes:
  nasa_data:
    driver: local
